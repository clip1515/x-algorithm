name: "[TEST] Notify body verification (temporary, do not merge)"

# TEMPORARY, ISOLATED TEST HARNESS.
# Exercises the exact body-construction logic of the "Open notification
# issue" step from notify-upstream-update.yml inside a real GitHub Actions
# runner, without creating a real Issue (gh issue create is mocked with a
# cat of the generated body file) and without touching production state.

on:
  push:
    branches:
      - test/notify-body-verification

env:
  UPSTREAM_REPO: xai-org/x-algorithm

jobs:
  verify-body:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "(MOCK) Build and print notification issue body"
        env:
          COMMIT_MESSAGE: "Open-source X Recommendation Algorithm"
          NEW_SHA: "cb45b5501423126adfc508052116c2d67c0e3fec"
          NEW_URL: "https://github.com/xai-org/x-algorithm/commit/cb45b5501423126adfc508052116c2d67c0e3fec"
          NEW_DATE: "2026-10-09T05:42:57Z"
          NEW_AUTHOR: "CI agent"
          PREV_SHA: "0000000000000000000000000000000000dead"
        run: |
          set -euo pipefail
          DETECTED_AT_JST=$(TZ=Asia/Tokyo date +"%Y-%m-%d %H:%M:%S JST")
          COMPARE_URL="https://github.com/${UPSTREAM_REPO}/compare/${PREV_SHA}...${NEW_SHA}"

          BODY_FILE=$(mktemp)
          {
            echo "Upstream repository [\`${UPSTREAM_REPO}\`](https://github.com/${UPSTREAM_REPO}) has new commits since the last check."
            echo
            echo "**Detected at (JST):** ${DETECTED_AT_JST}"
            echo "**Latest commit:** [${NEW_SHA}](${NEW_URL})"
            echo "**Author:** ${NEW_AUTHOR}"
            echo "**Date:** ${NEW_DATE}"
            echo "**Diff since last check:** [compare ${PREV_SHA:0:7}...${NEW_SHA:0:7}](${COMPARE_URL})"
            echo
            echo "**Message:**"
            echo '```'
            echo "$COMMIT_MESSAGE"
            echo '```'
            echo
            echo "> **Note:** This only means the upstream default branch has a new commit."
            echo "> It does **not** by itself confirm that the X recommendation algorithm's actual ranking"
            echo "> behavior changed (the commit could be docs/tests/CI-only). Check the compare link above"
            echo "> to judge the real impact before assuming ranking logic changed."
            echo
            echo "See the [upstream README's Notable Updates section](https://github.com/${UPSTREAM_REPO}#notable-updates) for a human-readable changelog."
            echo
            echo "---"
            echo "_Opened automatically by the [Notify on X Algorithm Update](../actions/workflows/notify-upstream-update.yml) workflow._"
          } > "$BODY_FILE"

          echo "===== MOCK gh issue create --body-file (no real API call made) ====="
          echo "title=🔔 X algorithm updated upstream ($(date -u +%Y-%m-%d))"
          echo "--- body-file content ---"
          cat "$BODY_FILE"
          echo "--- end body-file ---"

          # Required-field assertions (fail the job if any field is missing)
          grep -q "Detected at (JST)" "$BODY_FILE" || { echo "MISSING: JST detection time" >&2; exit 1; }
          grep -q "compare 0000000...cb45b55" "$BODY_FILE" || { echo "MISSING: compare link" >&2; exit 1; }
          grep -q "does \*\*not\*\* by itself confirm" "$BODY_FILE" || { echo "MISSING: behavior-change caveat" >&2; exit 1; }
          echo "All required fields present."
