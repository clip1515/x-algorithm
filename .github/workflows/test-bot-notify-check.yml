name: "[TEST] GitHub Actions bot notification check (temporary, do not merge)"

# TEMPORARY, isolated test workflow. Manually triggered only
# (workflow_dispatch). Verifies that github-actions[bot], via the
# default GITHUB_TOKEN with issues:write granted here, can create a
# real Issue (or confirms one already exists, without duplicating it).
# Touches nothing related to the production 6-hour monitor
# (notify-upstream-update.yml), upstream-state.json, or the audit log.
# Delete this file after the test.

on:
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  bot-notify-test:
    runs-on: ubuntu-latest
    steps:
      - name: Create bot test issue (dedup by title)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TITLE="通知テスト — GitHub Actions bot"
          EXISTING=$(gh issue list --search "\"$TITLE\" in:title" --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)
          if [ -n "$EXISTING" ]; then
            echo "Issue already exists: #$EXISTING -- skipping duplicate creation"
            exit 0
          fi
          URL=$(gh issue create \
            --title "$TITLE" \
            --body "これは通知テストであり、Xアルゴリズムの実際の更新ではありません。GitHub Actionsのgithub-actions[bot]からの通知が正しく届くかを確認するための、一時的なテストワークフローによって作成されたIssueです。既存の6時間監視ワークフロー・本番state(upstream-state.json)・監査ログには一切触れていません。確認後はクローズしてください。")
          echo "Created issue: $URL"
