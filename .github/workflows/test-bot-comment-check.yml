name: "[TEST] GitHub Actions bot comment notification check (temporary, do not merge)"

# TEMPORARY, isolated test workflow. Manually triggered only
# (workflow_dispatch). Posts one @mention comment on the existing test
# Issue #8 via github-actions[bot] (GITHUB_TOKEN with issues:write
# granted here), to check whether an @mention comment reaches iPhone
# GitHub Mobile push notifications. Does not create any new Issue.
# Touches nothing related to the production 6-hour monitor
# (notify-upstream-update.yml), upstream-state.json, or the audit log.
# Delete this file after the test.

on:
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  bot-comment-test:
    runs-on: ubuntu-latest
    steps:
      - name: Post test comment on Issue #8 (dedup by body content)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ISSUE_NUMBER=8
          MARKER="GitHub Mobileプッシュ通知テストです"

          EXISTING=$(gh issue view "$ISSUE_NUMBER" --json comments \
            --jq ".comments[] | select(.body | contains(\"$MARKER\")) | .url" | head -n1)
          if [ -n "$EXISTING" ]; then
            echo "Comment already exists: $EXISTING -- skipping duplicate post"
            exit 0
          fi

          BODY_FILE=$(mktemp)
          printf '%s\n%s\n' "@clip1515" "🔔 GitHub Mobileプッシュ通知テストです。Xアルゴリズムの実際の更新ではありません。" > "$BODY_FILE"

          URL=$(gh issue comment "$ISSUE_NUMBER" --body-file "$BODY_FILE")
          echo "Posted comment: $URL"
