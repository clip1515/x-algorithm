name: Notify on X Algorithm Update

# Watches the official upstream repository (xai-org/x-algorithm) and opens an
# issue in this project whenever new commits land there, so watchers of this
# repo get a GitHub notification when the X "For You" algorithm is updated.

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write
  issues: write

env:
  UPSTREAM_REPO: xai-org/x-algorithm
  STATE_FILE: .github/upstream-state.json

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest upstream commit
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RESP=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${UPSTREAM_REPO}/commits?per_page=1")

          SHA=$(echo "$RESP" | jq -r '.[0].sha')
          URL=$(echo "$RESP" | jq -r '.[0].html_url')
          DATE=$(echo "$RESP" | jq -r '.[0].commit.author.date')
          AUTHOR=$(echo "$RESP" | jq -r '.[0].commit.author.name')

          if [ -z "$SHA" ] || [ "$SHA" = "null" ]; then
            echo "Failed to read latest upstream commit" >&2
            exit 1
          fi

          {
            echo "sha=$SHA"
            echo "url=$URL"
            echo "date=$DATE"
            echo "author=$AUTHOR"
          } >> "$GITHUB_OUTPUT"

          {
            echo "message<<MSG_EOF"
            echo "$RESP" | jq -r '.[0].commit.message'
            echo "MSG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Read previously seen commit
        id: prev
        run: |
          set -euo pipefail
          if [ -f "$STATE_FILE" ]; then
            PREV_SHA=$(jq -r '.sha // empty' "$STATE_FILE")
          else
            PREV_SHA=""
          fi
          echo "sha=$PREV_SHA" >> "$GITHUB_OUTPUT"

      - name: Open notification issue
        if: steps.upstream.outputs.sha != steps.prev.outputs.sha && steps.prev.outputs.sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: ${{ steps.upstream.outputs.message }}
          NEW_SHA: ${{ steps.upstream.outputs.sha }}
          NEW_URL: ${{ steps.upstream.outputs.url }}
          NEW_DATE: ${{ steps.upstream.outputs.date }}
          NEW_AUTHOR: ${{ steps.upstream.outputs.author }}
          PREV_SHA: ${{ steps.prev.outputs.sha }}
        run: |
          set -euo pipefail
          DETECTED_AT_JST=$(TZ=Asia/Tokyo date +"%Y-%m-%d %H:%M:%S JST")
          COMPARE_URL="https://github.com/${UPSTREAM_REPO}/compare/${PREV_SHA}...${NEW_SHA}"

          BODY_FILE=$(mktemp)
          {
            echo "Upstream repository [\`${UPSTREAM_REPO}\`](https://github.com/${UPSTREAM_REPO}) has new commits since the last check."
            echo
            echo "**Detected at (JST):** ${DETECTED_AT_JST}"
            echo "**Latest commit:** [${NEW_SHA}](${NEW_URL})"
            echo "**Author:** ${NEW_AUTHOR}"
            echo "**Date:** ${NEW_DATE}"
            echo "**Diff since last check:** [compare ${PREV_SHA:0:7}...${NEW_SHA:0:7}](${COMPARE_URL})"
            echo
            echo "**Message:**"
            echo '```'
            echo "$COMMIT_MESSAGE"
            echo '```'
            echo
            echo "> **Note:** This only means the upstream default branch has a new commit."
            echo "> It does **not** by itself confirm that the X recommendation algorithm's actual ranking"
            echo "> behavior changed (the commit could be docs/tests/CI-only). Check the compare link above"
            echo "> to judge the real impact before assuming ranking logic changed."
            echo
            echo "See the [upstream README's Notable Updates section](https://github.com/${UPSTREAM_REPO}#notable-updates) for a human-readable changelog."
            echo
            echo "---"
            echo "_Opened automatically by the [Notify on X Algorithm Update](../actions/workflows/notify-upstream-update.yml) workflow._"
          } > "$BODY_FILE"

          gh issue create \
            --title "🔔 X algorithm updated upstream ($(date -u +%Y-%m-%d))" \
            --body-file "$BODY_FILE"

      - name: Save latest seen commit
        if: steps.upstream.outputs.sha != steps.prev.outputs.sha
        run: |
          mkdir -p "$(dirname "$STATE_FILE")"
          jq -n \
            --arg sha "${{ steps.upstream.outputs.sha }}" \
            --arg url "${{ steps.upstream.outputs.url }}" \
            --arg date "${{ steps.upstream.outputs.date }}" \
            --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{sha: $sha, url: $url, date: $date, checked_at: $checked_at}' \
            > "$STATE_FILE"

      - name: Commit updated state
        if: steps.upstream.outputs.sha != steps.prev.outputs.sha
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$STATE_FILE"
          git diff --cached --quiet && echo "No state change to commit" && exit 0
          git commit -m "chore: record latest seen upstream commit [skip ci]"
          git push
